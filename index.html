<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XV de Hanna</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="destellos">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
    <!-- ==================== PORTADA ==================== -->

    <section class="portada">

        <div class="portadaDecoracion">

            <!-- Decoración superior izquierda -->
            <img class="decorado decorado-superior" src="img/decorado.webp" alt="">

            <!-- Decoraciones superiores derecha -->
            <div class="decoradoDerecha">

                <img class="serpentina serpentina-derecha" src="img/serpentina.webp" alt="">

                <img class="bola-disco bola-disco-derecha" src="img/bola_disco.webp" alt="">

            </div>


            <!-- TÍTULO -->

            <div class="portadaTitulo">

                <div class="portadaTituloH2">
                    Mis
                </div>

                <div class="portadaTituloH1">
                    <h1>XV</h1>
                </div>

                <div class="portadaTituloH3">
                    <img src="img/hanna.webp" alt="">
                </div>

                <div class="portadaTituloCopa">
                    <img src="img/copas.webp" alt="">
                </div>

            </div>


            <!-- Decoraciones inferiores izquierda -->

            <div class="decoradoIzquierda">

                <img class="serpentina serpentina-izquierda" src="img/serpentina.webp" alt="">

                <img class="bola-disco bola-disco-izquierda" src="img/bola_disco.webp" alt="">

            </div>


            <!-- ESTRELLAS -->

            <div class="conjuntoEstrellas">

                <img class="estrellas-grupo" src="img/estrellass.webp" alt="">

                <img class="estrella estrella-grande" src="img/estrella.webp" alt="">

                <img class="estrella estrella-pequena" src="img/estrella.webp" alt="">

            </div>

        </div>

    </section>


    <!-- ==================== UBICACIÓN ==================== -->

    <section class="seccion ubicacion">

        <img class="imagen-seccion" src="img/ubicacion.webp" alt="">

        <a class="ubicacionBoton" href="https://maps.app.goo.gl/gvnoopBoLgA5f4cW6" target="_blank">
            <h2>Abrir Maps</h2>
        </a>

        <div class="ubicacionDecorado">

            <img src="img/decorado.webp" alt="">

        </div>

        <div class="ubicacionTrago">

            <img src="img/trago.webp" alt="">

        </div>

    </section>


    <!-- ==================== CONTADOR ==================== -->

    <section class="contador-container seccion">

        <img class="beso-contador" src="img/labios.webp" alt="">

        <div class="contador">

            <div class="unidad">

                <div class="numero" id="dias">
                    00
                </div>

                <span>Días</span>

            </div>


            <div class="separador">
                :
            </div>


            <div class="unidad">

                <div class="numero" id="horas">
                    00
                </div>

                <span>Horas</span>

            </div>


            <div class="separador">
                :
            </div>


            <div class="unidad">

                <div class="numero" id="minutos">
                    00
                </div>

                <span>Minutos</span>

            </div>

        </div>


        <div class="fecha">

            <div>
                <b>14</b> de <b>Noviembre</b>
            </div>

            <div>
                de <b>2026</b>
            </div>

        </div>

    </section>


    <!-- ==================== DRESS CODE ==================== -->

    <section class="seccion dress">

        <img class="imagen-seccion" src="img/dress.webp" alt="">

        <div class="dressBoton">

            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdXSyl5vUOywXcZLmYcrgODbPA19pgo2k2OHJMvcTtEqsb0aw/viewform"
                target="_blank">
                <h2>
                    Confirma tu asistencia
                </h2>
            </a>

        </div>


        <div class="dressEstrellas">

            <div class="dressEstrellaIzq">

                <img src="img/estrella.webp" alt="">

            </div>

            <div class="dressEstrellaDer">

                <img src="img/estrella.webp" alt="">

            </div>

        </div>

    </section>


    <!-- ==================== FOTOS ==================== -->

    <section class="seccion fotos">

        <div class="fotosFondo">

            <a href="https://drive.google.com/drive/folders/1ZOA-2q7KXKtVrACU0I2YJp_jGRIt8g0D?usp=drive_link"
                target="_blank"> <img src="img/fotos.webp" alt=""></a>

        </div>


        <div class="fotosTexto">

            <h2>
                Tus recuerdos también son parte de esta noche
            </h2>

        </div>


        <div class="divisores">

            <img class="divisor divisor-superior" src="img/divisor.webp" alt="">

            <img class="divisor divisor-inferior" src="img/divisor.webp" alt="">

        </div>

    </section>


    <!-- ==================== POLAROIDS ==================== -->

    <section class="polaroid seccion">

        <div class="polaroidMono">

            <img src="img/moño.webp" alt="">

        </div>


        <div class="polaroidFotos">

            <img src="img/polaroid.webp" alt="">

        </div>

    </section>


    <!-- ==================== REGALO ==================== -->

    <section class="seccion regalo">

        <img class="imagen-seccion" src="img/regalo.webp" alt="">

    </section>


    <audio id="musica" loop>
        <source src="audio/cancion.mp3" type="audio/mpeg">
    </audio>

    <script src="javascript.js"></script>

</body>

</html>
